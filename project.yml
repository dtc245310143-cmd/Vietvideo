name: VietVideoVoiceCheck
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    revision: 7f75a2299dc329c0b7855afb25d47663a02855cb
targets:
  VietVideoVoiceCheck:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets
        type: folder
        buildPhase: resources
    dependencies:
      - package: YouTubeKit
      - framework: Vendor/SeaG2P.xcframework
        embed: false
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/SeaBridge.h
        PRODUCT_BUNDLE_IDENTIFIER: vn.vietvideo.voicecheck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VietVideo
        MARKETING_VERSION: '1.0.2'
        CURRENT_PROJECT_VERSION: '12'
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Lưu video đã xuất vào Ảnh khi bạn chọn lưu.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  VietVideoVoiceCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: VietVideoVoiceCheck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: vn.vietvideo.voicecheck.tests
schemes:
  VietVideoVoiceCheck:
    build:
      targets:
        VietVideoVoiceCheck: all
    test:
      targets: [VietVideoVoiceCheckTests]


